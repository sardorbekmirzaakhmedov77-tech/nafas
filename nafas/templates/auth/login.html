{% extends "base.html" %}
{% block title %}Sign in | Nafas{% endblock %}
{% block content %}
<div class="auth">
  <div class="auth__card">
    <h1>Sign in</h1>
    <p>Manage the cities you watch and your alert levels.</p>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" novalidate>
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" value="{{ email }}" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <label class="check"><input type="checkbox" name="remember" value="1"> Keep me signed in</label>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <p class="auth__alt">New to Nafas? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
